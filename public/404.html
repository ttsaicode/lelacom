<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n-title="nf.title">Oops.... Page not found — LELA</title>
  <meta name="theme-color" content="#EDEBE6" />
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+Ethiopic:wght@400;500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="shortcut icon" href="svgbg.png" type="image/x-icon" />
  <link rel="stylesheet" href="/landing.css" />
  <script src="/theme-init.js"></script>
  <script src="/language.js" defer></script>
  <script src="/landing.js" defer></script>
  <style>
    /* ─────────────────────────────────────────────────────────────
       404 Exact Match Layout (Zero Footer, Exact Visual Alignment)
       ───────────────────────────────────────────────────────────── */
    html, body {
      min-height: 100vh;
      margin: 0;
      padding: 0;
      background: var(--page-bg, var(--bg));
      display: flex;
      flex-direction: column;
    }

    /* Minimalist unobtrusive top nav */
    .nav.shell {
      border-bottom: 1px solid var(--line);
    }

    .nf-page-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(32px, 5vh, 64px) clamp(20px, 4.5vw, 64px);
    }

    .nf-exact-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: clamp(32px, 6vw, 84px);
      width: 100%;
      max-width: 1140px;
      margin: 0 auto;
    }

    .nf-exact-text {
      flex: 1;
      max-width: 480px;
    }

    .nf-exact-oops {
      font-family: var(--f-sans);
      font-size: clamp(40px, 5vw, 60px);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.035em;
      color: var(--fg);
      margin: 0 0 10px;
    }

    .nf-exact-h2 {
      font-family: var(--f-sans);
      font-size: clamp(28px, 3.4vw, 42px);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.025em;
      color: var(--fg);
      margin: 0 0 18px;
    }

    .nf-exact-copy {
      font-family: var(--f-sans);
      font-size: clamp(15.5px, 1.25vw, 18px);
      line-height: 1.55;
      color: var(--muted);
      margin: 0 0 32px;
    }

    .nf-exact-copy span {
      display: block;
    }

    .nf-exact-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 13px 26px;
      border-radius: 10px;
      font-family: var(--f-sans);
      font-size: 15px;
      font-weight: 600;
      color: #ffffff !important;
      background: linear-gradient(90deg, #9333ea 0%, #6366f1 100%);
      box-shadow: 0 8px 20px -4px rgba(124, 58, 237, 0.42);
      text-decoration: none;
      transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease), filter 0.2s;
    }

    .nf-exact-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px -4px rgba(124, 58, 237, 0.55);
      filter: brightness(1.06);
      color: #ffffff !important;
    }

    .nf-exact-btn:active {
      transform: translateY(1px);
    }

    .nf-exact-btn svg {
      width: 17px;
      height: 17px;
      transition: transform 0.2s ease;
    }

    .nf-exact-btn:hover svg {
      transform: translateX(-3px);
    }

    /* 3D Exact Artwork Column */
    .nf-exact-image-col {
      flex: 1.15;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      width: 100%;
    }

    .nf-exact-illustration {
      width: 100%;
      max-width: 520px;
      height: auto;
      display: block;
      object-fit: contain;
      image-rendering: auto;
      image-rendering: -webkit-optimize-contrast;
      backface-visibility: hidden;
      transform: translate3d(0, 0, 0);
      will-change: transform;
      filter: drop-shadow(0 16px 36px rgba(124, 58, 237, 0.16));
      animation: nfFloat 6s ease-in-out infinite;
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    :root[data-theme="dark"] .nf-exact-illustration {
      filter: drop-shadow(0 20px 48px rgba(147, 51, 234, 0.32));
    }

    @keyframes nfFloat {
      0%, 100% { transform: translate3d(0, 0px, 0); }
      50% { transform: translate3d(0, -8px, 0); }
    }

    @media (max-width: 860px) {
      .nf-exact-row {
        flex-direction: column-reverse;
        text-align: center;
        gap: 36px;
      }
      .nf-exact-text {
        max-width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .nf-exact-illustration {
        max-width: 360px;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="a11y.skip">Skip to content</a>

  <!-- ───────────────────────── TOP NAV ───────────────────────── -->
  <header class="nav shell">
    <a class="wordmark" href="/" aria-label="LELA home"><img class="nav-logo" src="/svgbg.png" alt="" width="26" height="26" /><span data-i18n="brand.word">LELA</span></a>

    <nav class="nav-links" aria-label="Primary">
      <a href="/#how" data-i18n="nav.how">How it works</a>
      <a href="/about" data-i18n="nav.about">About</a>
      <a href="/contact" data-i18n="nav.contact">Contact</a>
    </nav>

    <div class="nav-tools">
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true" lang="en">EN</button>
        <span class="sep" aria-hidden="true">/</span>
        <button type="button" data-lang="am" aria-pressed="false" lang="am">አማ</button>
      </div>

      <button class="theme-toggle" id="themeToggle" type="button" data-i18n-attr="aria-label:theme.toDark" aria-label="Switch to dark mode">
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
      </button>

      <a class="nav-enter" href="/app" data-i18n="nav.enter">Enter</a>

      <button class="burger" id="navBurger" type="button" aria-expanded="false" aria-controls="navDrawer" data-i18n-attr="aria-label:drawer.open" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- ───────────────────────── DRAWER ───────────────────────── -->
  <div class="drawer-backdrop" id="drawerBackdrop"></div>

  <nav class="drawer" id="navDrawer" aria-label="Menu" data-i18n-attr="aria-label:drawer.menu">
    <div class="drawer-head">
      <span class="wordmark" aria-hidden="true"><img class="nav-logo" src="/svgbg.png" alt="" width="26" height="26" /><span data-i18n="brand.word">LELA</span></span>
      <button class="drawer-close" id="drawerClose" type="button" data-i18n-attr="aria-label:drawer.close" aria-label="Close menu"></button>
    </div>

    <ul class="drawer-links">
      <li><a href="/#how" data-i18n="nav.how">How it works</a></li>
      <li><a href="/about" data-i18n="nav.about">About</a></li>
      <li><a href="/contact" data-i18n="nav.contact">Contact</a></li>
      <li><a href="/guidelines" data-i18n="nav.guidelines">Guidelines</a></li>
    </ul>

    <div class="drawer-utility">
      <div class="drawer-utility-row">
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" data-lang="en" aria-pressed="true" lang="en">EN</button>
          <span class="sep" aria-hidden="true">/</span>
          <button type="button" data-lang="am" aria-pressed="false" lang="am">አማ</button>
        </div>

        <button class="theme-toggle" id="themeToggleDrawer" type="button" data-i18n-attr="aria-label:theme.toDark" aria-label="Switch to dark mode">
          <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
          <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
        </button>
      </div>

      <a class="btn" href="/app" data-i18n="cta.start">Start video chat</a>
    </div>
  </nav>

  <!-- ───────────────────────── 404 MAIN (EXACT LOOK, NO FOOTER) ───────────────────────── -->
  <main id="main" class="nf-page-container">
    <div class="nf-exact-row">
      <div class="nf-exact-text">
        <h1 class="nf-exact-oops" data-i18n="nf.oops">Oops....</h1>
        <h2 class="nf-exact-h2" data-i18n="nf.titleH2">Page not found</h2>
        <p class="nf-exact-copy">
          <span data-i18n="nf.desc1">This Page doesn’t exist or was removed!</span>
          <span data-i18n="nf.desc2">We suggest you back to home.</span>
        </p>
        <a class="nf-exact-btn" href="/" data-i18n="nf.back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span data-i18n="nf.btnText">Back to home</span>
        </a>
      </div>

      <div class="nf-exact-image-col">
        <img
          src="/404-artwork-smooth.png"
          alt="404 Page Not Found"
          class="nf-exact-illustration"
          width="482"
          height="345"
          loading="eager"
          decoding="async"
        />
      </div>
    </div>
  </main>
</body>
</html>
